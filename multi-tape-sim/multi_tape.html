<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شبیه‌ساز تورینگ: دو-نواره (بررسی معکوس - غیرهمگام)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 8px;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            overflow: hidden;
        }

        .tape-cell { transition: all 0.15s ease-in-out; }
        .head-active-1 { 
            box-shadow: 0 0 0 4px #3b82f6; 
            z-index: 10; 
            transform: scale(1.1); 
            background-color: #eff6ff !important;
        }
        .head-active-2 { 
            box-shadow: 0 0 0 4px #10b981; 
            z-index: 10; 
            transform: scale(1.1); 
            background-color: #ecfdf5 !important;
        }

        .display-none {display: none;}
        
        .tapeScrollWrapper::-webkit-scrollbar { display: none; }
        .tapeScrollWrapper { -ms-overflow-style: none; scrollbar-width: none; }

        #network-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #network {
            flex: 1;
            min-height: 0;
            width: 100%;
            border: 1px solid #e2e8f0;
            background-color: #fafafa;
            border-radius: 0.5rem;
        }

        @media (max-height: 700px) {
           .game-container { gap: 6px; padding: 8px; }
           .controls-panel { padding: 6px !important; gap: 6px !important; }
           .tape-cell { height: 38px !important; width: 34px !important; }
           .tape-cell span { font-size: 1.1rem !important; }
           .tapeScrollWrapper { padding-top: 16px !important; padding-bottom: 6px !important; }
           .head-label { top: -14px !important; font-size: 8px !important; padding: 0 2px !important;}
           .title-text { font-size: 1rem !important; margin-bottom: 0 !important;}
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="game-container">
        <!-- Algorithm Input -->
        <div class="display-none">
            <textarea id="tmCode" rows="4" dir="ltr">tm=prep (prep,0,0,prep,0,S,0,R)(prep,0,1,prep,0,S,1,R)(prep,1,0,prep,1,S,0,R)(prep,1,1,prep,1,S,1,R)(prep,_,0,prep,_,S,0,R)(prep,_,1,prep,_,S,1,R)(prep,0,_,compare,0,S,_,L)(prep,1,_,compare,1,S,_,L)(prep,_,_,compare,_,S,_,L)(compare,0,0,check_0,0,R,0,S)(compare,0,1,check_0,0,R,1,S)(compare,0,_,check_0,0,R,_,S)(compare,1,0,check_1,1,R,0,S)(compare,1,1,check_1,1,R,1,S)(compare,1,_,check_1,1,R,_,S)(compare,_,0,reject,_,S,0,S)(compare,_,1,reject,_,S,1,S)(compare,_,_,accept,_,S,_,S)(check_0,0,0,compare,0,S,0,L)(check_0,1,0,compare,1,S,0,L)(check_0,_,0,compare,_,S,0,L)(check_0,0,1,reject,0,S,1,S)(check_0,1,1,reject,1,S,1,S)(check_0,_,1,reject,_,S,1,S)(check_0,0,_,reject,0,S,_,S)(check_0,1,_,reject,1,S,_,S)(check_0,_,_,reject,_,S,_,S)(check_1,0,1,compare,0,S,1,L)(check_1,1,1,compare,1,S,1,L)(check_1,_,1,compare,_,S,1,L)(check_1,0,0,reject,0,S,0,S)(check_1,1,0,reject,1,S,0,S)(check_1,_,0,reject,_,S,0,S)(check_1,0,_,reject,0,S,_,S)(check_1,1,_,reject,1,S,_,S)(check_1,_,_,reject,_,S,_,S)</textarea>
        </div>

        <!-- Controls (Compact for mobile) -->
        <div class="controls-panel flex flex-col sm:flex-row gap-3 bg-gray-50 p-2 sm:p-3 rounded-lg border shrink-0 items-center justify-between">
            <div class="flex gap-2 w-full sm:w-auto">
                <div class="flex-1 flex flex-col">
                    <label class="font-bold text-[11px] md:text-xs mb-0.5 text-gray-600">ورودی نوار ۱:</label>
                    <input type="text" id="input1" value="110" class="w-full border p-1 md:p-1.5 rounded text-left font-mono text-sm md:text-base outline-none focus:border-blue-500" dir="ltr">
                </div>
                <div class="flex-1 flex flex-col">
                    <label class="font-bold text-[11px] md:text-xs mb-0.5 text-gray-600">ورودی نوار ۲:</label>
                    <input type="text" id="input2" value="011" class="w-full border p-1 md:p-1.5 rounded text-left font-mono text-sm md:text-base outline-none focus:border-blue-500" dir="ltr">
                </div>
            </div>
            
            <div class="flex justify-center gap-2 mt-1 sm:mt-0">
                <button onclick="initSimulation()" class="w-10 h-10 md:w-11 md:h-11 flex justify-center items-center text-lg bg-blue-600 text-white rounded-full shadow hover:bg-blue-700 transition" title="ریست نوارها">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button onclick="stepSimulation()" id="stepBtn" class="w-10 h-10 md:w-11 md:h-11 flex justify-center items-center text-lg bg-green-600 text-white rounded-full shadow hover:bg-green-700 transition opacity-50 cursor-not-allowed" disabled title="یک گام">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button onclick="togglePlay()" id="playBtn" class="w-10 h-10 md:w-11 md:h-11 flex justify-center items-center text-lg bg-purple-600 text-white rounded-full shadow hover:bg-purple-700 transition opacity-50 cursor-not-allowed" disabled title="پخش / توقف خودکار">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
        </div>

        <!-- Status -->
        <div class="text-center shrink-0">
            <p id="statusText" class="text-sm md:text-base font-bold text-gray-600">آماده برای شروع شبیه‌سازی دو-نواره</p>
        </div>

        <!-- 2D Infinite Tapes -->
        <div class="shrink-0 relative grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-4 w-full">
            <!-- Tape 1 -->
            <div class="w-full relative">
                <h2 class="font-bold text-[11px] md:text-sm mb-1 text-slate-700">نوار ۱ (Tape 1)</h2>
                <div id="tapeScrollWrapper1" class="tapeScrollWrapper overflow-x-hidden pb-2 pt-5 border rounded-lg bg-slate-100 shadow-inner relative" dir="ltr">
                    <div id="tapeContainer1" class="flex justify-center items-center space-x-1 w-max px-[25vw]">
                        <!-- Cells generated via JS -->
                    </div>
                </div>
            </div>

            <!-- Tape 2 -->
            <div class="w-full relative">
                <h2 class="font-bold text-[11px] md:text-sm mb-1 text-slate-700">نوار ۲ (Tape 2)</h2>
                <div id="tapeScrollWrapper2" class="tapeScrollWrapper overflow-x-hidden pb-2 pt-5 border rounded-lg bg-slate-100 shadow-inner relative" dir="ltr">
                    <div id="tapeContainer2" class="flex justify-center items-center space-x-1 w-max px-[25vw]">
                        <!-- Cells generated via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Vis Network Diagram -->
        <div id="network-wrapper">
            <h2 class="font-bold text-[12px] md:text-sm mb-1 text-slate-700 shrink-0">نمودار حالت‌های ماشین</h2>
            <div id="network"></div>
        </div>

    </div>

    <script>
        let tmMap = {};
        let initialTMState = '';
        
        let tape1 = [];
        let tape2 = [];
        let physHead1 = 0;
        let physHead2 = 0;
        
        let currentState = ''; 
        let playInterval = null;
        const BLANK = '_';

        // Vis.js Variables
        let nodes, edges, network;
        const DEFAULT_COLOR = { background: '#ffffff', border: '#94a3b8' };
        const ACTIVE_COLOR = { background: '#fef08a', border: '#ca8a04' };

        // Parse 2-Tape Algorithm
        function parseAlgorithm() {
            tmMap = {};
            let rawText = document.getElementById('tmCode').value.trim();
            let cleanText = rawText.replace(/^tm=/, '').trim();
            
            initialTMState = cleanText.split(/\s*\(/)[0].trim();
            if(!initialTMState) initialTMState = 'prep';

            let regex = /\(([^)]+)\)/g;
            let match;
            while ((match = regex.exec(cleanText)) !== null) {
                let parts = match[1].split(',');
                if(parts.length === 8) { 
                    let fromState = parts[0].trim();
                    let r1 = parts[1].trim();
                    let r2 = parts[2].trim();
                    
                    let toState = parts[3].trim();
                    let w1 = parts[4].trim();
                    let dir1 = parts[5].trim();
                    let w2 = parts[6].trim();
                    let dir2 = parts[7].trim();
                    
                    tmMap[`${fromState},${r1},${r2}`] = [toState, w1, dir1, w2, dir2];
                }
            }
        }

        function generateNetworkData() {
            let uniqueStates = new Set();
            let transitionsMap = {}; 

            Object.keys(tmMap).forEach(key => {
                let [fromState, r1, r2] = key.split(',');
                let [toState, w1, dir1, w2, dir2] = tmMap[key];
                
                uniqueStates.add(fromState);
                uniqueStates.add(toState);

                let edgeKey = `${fromState}|${toState}`;
                let label = `${r1},${r2} \u2794 ${w1},${dir1} | ${w2},${dir2}`;
                
                if (!transitionsMap[edgeKey]) transitionsMap[edgeKey] = [];
                transitionsMap[edgeKey].push(label);
            });

            let nodesData = Array.from(uniqueStates).map(state => ({
                id: state,
                label: state,
                shape: 'circle',
                color: (state === 'accept' ? {background:'#bbf7d0', border:'#22c55e'} : 
                       (state === 'reject' ? {background:'#fecaca', border:'#ef4444'} : DEFAULT_COLOR)),
                font: { size: 14, face: 'Vazirmatn', bold: true }
            }));

            let edgesData = Object.keys(transitionsMap).map(key => {
                let [from, to] = key.split('|');
                return {
                    from: from,
                    to: to,
                    label: transitionsMap[key].join('\n'),
                    arrows: 'to',
                    font: { align: 'horizontal', size: 11, color: '#334155', background: 'rgba(255,255,255,0.9)' },
                    color: { color: '#94a3b8' },
                    smooth: { type: 'curvedCW', roundness: 0.15 } 
                };
            });

            return { nodes: new vis.DataSet(nodesData), edges: new vis.DataSet(edgesData) };
        }

        function initNetwork() {
            const data = generateNetworkData();
            nodes = data.nodes;
            edges = data.edges;

            const container = document.getElementById('network');
            const options = {
                physics: {
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 200, 
                        springConstant: 0.05
                    }
                },
                layout: { randomSeed: 5 },
                interaction: { hover: true, tooltipDelay: 200 }
            };
            network = new vis.Network(container, data, options);
        }

        function initSimulation() {
            if(playInterval) togglePlay();
            
            parseAlgorithm();
            initNetwork();

            let s1 = document.getElementById('input1').value || '';
            let s2 = document.getElementById('input2').value || '';
            
            // Tape Initialization
            tape1 = [...s1.split('')];
            if(tape1.length === 0) tape1.push(BLANK);
            
            tape2 = [...s2.split('')];
            if(tape2.length === 0) tape2.push(BLANK);
            
            // Padding
            for(let i=0; i<15; i++) {
                tape1.push(BLANK); tape1.unshift(BLANK);
                tape2.push(BLANK); tape2.unshift(BLANK);
            }
            
            physHead1 = 15; 
            physHead2 = 15; 
            currentState = initialTMState;
            
            document.getElementById('stepBtn').disabled = false;
            document.getElementById('stepBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('playBtn').disabled = false;
            document.getElementById('playBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            
            document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
            document.getElementById('playBtn').classList.replace('bg-red-600', 'bg-purple-600');
            
            updateUI();
            centerTapeOnHead(true);
            
            if(nodes.get(currentState)) nodes.update({id: currentState, color: ACTIVE_COLOR});
        }

        function getDirectionValue(dirStr) {
            if (dirStr === 'R') return 1;
            if (dirStr === 'L') return -1;
            return 0; // 'S' or Stay
        }

        function stepSimulation() {
            if (currentState === 'accept' || currentState === 'reject') {
                if(playInterval) togglePlay();
                return;
            }

            // Expand tapes if heads approach edges
            if (physHead1 >= tape1.length - 2) { tape1.push(BLANK); tape1.push(BLANK); }
            if (physHead1 <= 2) { tape1.unshift(BLANK); tape1.unshift(BLANK); physHead1 += 2; }
            
            if (physHead2 >= tape2.length - 2) { tape2.push(BLANK); tape2.push(BLANK); }
            if (physHead2 <= 2) { tape2.unshift(BLANK); tape2.unshift(BLANK); physHead2 += 2; }

            let r1 = tape1[physHead1];
            let r2 = tape2[physHead2];
            let transitionKey = `${currentState},${r1},${r2}`;
            
            if (tmMap[transitionKey]) {
                let [nextState, w1, dir1, w2, dir2] = tmMap[transitionKey];
                
                tape1[physHead1] = w1;
                tape2[physHead2] = w2;
                
                if (currentState !== nextState && currentState !== 'accept' && currentState !== 'reject') {
                    nodes.update({id: currentState, color: DEFAULT_COLOR});
                }
                if (nextState !== 'accept' && nextState !== 'reject') {
                    nodes.update({id: nextState, color: ACTIVE_COLOR});
                }
                // زوم کمتر مشابه نسخه تک نواره
                network.focus(nextState, { scale: 0.5, animation: { duration: 250 } });

                currentState = nextState;
                physHead1 += getDirectionValue(dir1);
                physHead2 += getDirectionValue(dir2);
            } else {
                document.getElementById('statusText').innerText = `خطا: هیچ انتقالی برای (${currentState}, ${r1}, ${r2}) پیدا نشد!`;
                if(playInterval) togglePlay();
                return;
            }

            updateUI();
            centerTapeOnHead();
        }

        function togglePlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
                document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('playBtn').classList.replace('bg-red-600', 'bg-purple-600');
            } else {
                playInterval = setInterval(stepSimulation, 800);
                document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('playBtn').classList.replace('bg-purple-600', 'bg-red-600');
            }
        }

        function getStateHint(state) {
            if (state === 'prep') return "آماده‌سازی: انتقال مکانیکی هد دوم به انتهای رشته دوم";
            if (state === 'compare') return "بررسی و حرکت هد اول به سمت راست";
            if (state === 'check_0') return "بررسی و تطبیق کاراکتر '0' در نوار دوم";
            if (state === 'check_1') return "بررسی و تطبیق کاراکتر '1' در نوار دوم";
            return "در حال پردازش...";
        }

        function updateUI() {
            // Render Tape 1
            const container1 = document.getElementById('tapeContainer1');
            container1.innerHTML = '';
            tape1.forEach((cell, index) => {
                const isPhysHead = index === physHead1;
                container1.innerHTML += `
                    <div id="cell1-${index}" class="tape-cell border-2 ${isPhysHead ? 'border-blue-500 head-active-1 bg-blue-50' : 'border-slate-300 bg-white'} rounded w-10 h-12 md:w-12 md:h-14 flex justify-center items-center shrink-0 relative shadow-sm">
                        ${isPhysHead ? '<div class="head-label absolute -top-5 md:-top-6 text-[9px] md:text-[10px] font-bold text-blue-600 bg-blue-100 px-1 py-0.5 rounded shadow">هد ۱</div>' : ''}
                        <span class="font-mono text-lg md:text-xl text-slate-700">${cell}</span>
                    </div>
                `;
            });

            // Render Tape 2
            const container2 = document.getElementById('tapeContainer2');
            container2.innerHTML = '';
            tape2.forEach((cell, index) => {
                const isPhysHead = index === physHead2;
                container2.innerHTML += `
                    <div id="cell2-${index}" class="tape-cell border-2 ${isPhysHead ? 'border-green-500 head-active-2 bg-green-50' : 'border-slate-300 bg-white'} rounded w-10 h-12 md:w-12 md:h-14 flex justify-center items-center shrink-0 relative shadow-sm">
                        ${isPhysHead ? '<div class="head-label absolute -top-5 md:-top-6 text-[9px] md:text-[10px] font-bold text-green-700 bg-green-100 px-1 py-0.5 rounded shadow">هد ۲</div>' : ''}
                        <span class="font-mono text-lg md:text-xl text-slate-700">${cell}</span>
                    </div>
                `;
            });

            // بروزرسانی وضعیت به همراه راهنمای فارسی
            let statText = "";
            if(currentState === 'accept') statText = "نتیجه: Accept (پذیرش) ✔️";
            else if(currentState === 'reject') statText = "نتیجه: Reject (رد) ❌";
            else {
                let hint = getStateHint(currentState);
                statText = `حالت: ${currentState} (${hint}) | خواندن: (${tape1[physHead1]}, ${tape2[physHead2]})`;
            }
            
            document.getElementById('statusText').innerText = statText;
        }

        function centerTapeOnHead(instant = false) {
            setTimeout(() => {
                // Center Tape 1
                const head1Element = document.getElementById(`cell1-${physHead1}`);
                const wrapper1 = document.getElementById('tapeScrollWrapper1');
                if (head1Element && wrapper1) {
                    wrapper1.scrollTo({
                        left: head1Element.offsetLeft - (wrapper1.offsetWidth / 2) + (head1Element.offsetWidth / 2),
                        behavior: instant ? 'auto' : 'smooth'
                    });
                }
                
                // Center Tape 2
                const head2Element = document.getElementById(`cell2-${physHead2}`);
                const wrapper2 = document.getElementById('tapeScrollWrapper2');
                if (head2Element && wrapper2) {
                    wrapper2.scrollTo({
                        left: head2Element.offsetLeft - (wrapper2.offsetWidth / 2) + (head2Element.offsetWidth / 2),
                        behavior: instant ? 'auto' : 'smooth'
                    });
                }
            }, 10);
        }

        window.onload = () => {
            initSimulation();
        };
    </script>
</body>
</html>

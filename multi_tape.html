<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شبیه‌سازی ماشین تورینگ چندنواره</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#eef1f5;font-family:Tahoma,Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:30px 20px}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #282d35;padding-bottom:18px}
h1{font-size:24px;margin:0}.muted{color:#89929e;font-size:13px;margin-top:7px}.status{color:#9aa3af;font-size:13px;white-space:nowrap}.status b{color:#fff}
.machine{margin-top:34px}.label{color:#aeb6c0;font-size:14px;margin-bottom:8px}
.tape{display:flex;direction:ltr;justify-content:center;gap:5px;overflow:auto;padding:40px 8px 48px}
.cell{position:relative;width:58px;height:58px;flex:0 0 58px;background:#15191f;border:1px solid #3b434e;border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 24px Consolas,monospace}
.cell.head{border-color:#fff;box-shadow:0 0 0 2px #fff2}.headmark{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);font:900 18px Tahoma;color:#fff;line-height:1;white-space:nowrap}
.read{display:flex;gap:10px}.box{flex:1;background:#101319;border:1px solid #282e37;border-radius:4px;padding:13px}.box span{display:block;color:#7f8895;font-size:11px;margin-bottom:6px}.box b{font:700 22px Consolas,monospace}
.info{margin-top:18px;background:#101319;border:1px solid #282e37;border-radius:4px;padding:16px}.op{font-size:16px;margin-bottom:7px}.detail{font-size:13px;color:#9aa4b0;line-height:1.9}
.controls{text-align:center;margin-top:16px}.btn{background:#171b21;color:#eee;border:1px solid #3a424d;border-radius:4px;padding:9px 18px;cursor:pointer}.btn:hover{background:#20252d}
.result{display:none;text-align:center;border-top:1px solid #282e37;margin-top:24px;padding-top:24px}.result.show{display:block}.result h2{font-size:30px;margin:0 0 8px}.result p{color:#9aa4b0}
@media(max-width:650px){main{padding:22px 12px}header{display:block}.status{margin-top:10px}.cell{width:48px;height:48px;flex-basis:48px}.read{flex-direction:column}}
</style>
</head>
<body><main>
<header><div><h1>شبیه‌سازی ماشین تورینگ چندنواره</h1><div class="muted">دو نوار فیزیکی مستقل؛ ماشین خودش الگوریتم مقایسه را اجرا می‌کند.</div></div><div class="status">مرحله <b id="step">۰</b> | وضعیت <b id="state">در حال اجرا</b></div></header>
<section class="machine">
<div class="label">نوار ۱ — رشته A</div><div id="tapeA" class="tape"></div>
<div class="label">نوار ۲ — رشته B</div><div id="tapeB" class="tape"></div>
<div class="read"><div class="box"><span>نماد فعلی نوار ۱</span><b id="ra">—</b></div><div class="box"><span>نماد فعلی نوار ۲</span><b id="rb">—</b></div></div>
<div class="info"><div class="op" id="op"></div><div class="detail" id="detail"></div></div>
<div class="controls"><button class="btn" id="pauseBtn" onclick="toggle()">توقف</button> <button class="btn" onclick="restart()">شروع دوباره</button></div>
<div id="result" class="result"><h2 id="resultTitle"></h2><p id="resultText"></p></div>
</section></main>
<script>
const A="010110",B="010110";let ha=0,hb=0,step=0,phase="read",paused=false,timer=null;
const $=id=>document.getElementById(id);
function drawTape(id,s,h,label){const e=$(id);e.innerHTML="";[...s].forEach((x,i)=>{const c=document.createElement("div");c.className="cell"+(i===h?" head":"");c.textContent=x;if(i===h){const m=document.createElement("div");m.className="headmark";m.textContent="▲ "+label;c.appendChild(m)}e.appendChild(c)})}
function draw(){drawTape("tapeA",A,ha,"HEAD A");drawTape("tapeB",B,hb,"HEAD B");$("step").textContent=step.toLocaleString("fa-IR")}
function msg(o,d){$("op").textContent=o;$("detail").textContent=d}
function run(){if(paused)return;draw();
if(phase==="read"){if(ha===A.length&&hb===B.length)return finish(true);if(ha===A.length||hb===B.length)return finish(false);$("ra").textContent=A[ha];$("rb").textContent=B[hb];msg("ماشین دو نماد فعلی را می‌خواند.",`HEAD A = ${A[ha]} ، HEAD B = ${B[hb]}`);phase="compare";timer=setTimeout(run,6000)}
else if(phase==="compare"){if(A[ha]!==B[hb])return finish(false);msg("نمادها برابرند.",`${A[ha]} = ${B[hb]} ✓`);phase="moveA";timer=setTimeout(run,6000)}
else if(phase==="moveA"){ha++;step++;draw();msg("هد نوار ۱ یک خانه جلو می‌رود.","این حرکت HEAD A است.");phase="moveB";timer=setTimeout(run,6000)}
else if(phase==="moveB"){hb++;step++;draw();msg("هد نوار ۲ یک خانه جلو می‌رود.","این حرکت HEAD B است؛ دو هد هم‌زمان حرکت نمی‌کنند.");phase="read";timer=setTimeout(run,6000)}}
function finish(ok){clearTimeout(timer);$("state").textContent=ok?"پذیرش":"رد";$("result").classList.add("show");$("resultTitle").textContent=ok?"ACCEPT":"REJECT";$("resultText").textContent=ok?"دو رشته یکسان بودند.":"دو رشته یکسان نبودند.";msg("اجرای ماشین تمام شد.",ok?"ماشین به وضعیت پذیرش رسید.":"ماشین به وضعیت رد رسید.")}
function toggle(){paused=!paused;$("pauseBtn").textContent=paused?"ادامه":"توقف";$("state").textContent=paused?"متوقف":"در حال اجرا";if(!paused)run()}
function restart(){clearTimeout(timer);ha=0;hb=0;step=0;phase="read";paused=false;$("pauseBtn").textContent="توقف";$("state").textContent="در حال اجرا";$("result").classList.remove("show");$("ra").textContent="—";$("rb").textContent="—";run()}restart();
</script></body></html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>مینی‌گیم فرار از زندان — نسخه نقشه</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --grid-max: 340px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: Vazirmatn, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    .game-container {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: auto;
    }

    .columns {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-direction: row-reverse;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 0;
      min-width: 0;
      align-items: center;
    }

    .section-label {
      font-size: clamp(0.7rem, 2.2vw, 0.82rem);
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      width: 100%;
      line-height: 1.4;
    }

    .section-label.dark-label { color: #1e293b; }
    .section-label.map-label  { color: #64748b; }

    /* ── Dark Grid ── */
    .dark-grid-wrapper {
      position: relative;
      border-radius: 8px;
      padding: 4px;
      background: #0f172a;
      width: 100%;
      max-width: var(--grid-max);
      aspect-ratio: 1 / 1;
    }

    .dark-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: #1e293b;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .dark-cell {
      position: relative;
      border-right: 1px solid #334155;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .dark-cell:nth-child(6n) { border-right: none; }
    .dark-cell:nth-child(n+31) { border-bottom: none; }

    .dark-cell.revealed { background-color: #16a34a; }
    .dark-cell.failed   { background-color: #dc2626; }

    /* Player emoji is now positioned relative to .dark-grid-wrapper,
       so it does NOT interfere with the grid layout. */
    .player-emoji {
      position: absolute;
      width: calc(100% / 6);
      height: calc(100% / 6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.9rem, 3.2vw, 1.5rem);
      pointer-events: none;
      z-index: 10;
      top: 0;
      left: 0;
      transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                  left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Map Grid ── */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background-color: #eaeaea;
      border-radius: 6px;
      border: 3px solid #000000;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: var(--grid-max);
      aspect-ratio: 1 / 1;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eaeaea;
      position: relative;
      border-right: 1px solid #cccccc;
      border-bottom: 1px solid #cccccc;
    }

    .cell.green-cell { background-color: #86efac !important; }

    .map-player {
      display: block;
      width: 30%;
      aspect-ratio: 1;
      border-radius: 50%;
      background-color: #0f172a;
      box-shadow: 0 0 0 2px #ffffff;
      position: absolute;
      z-index: 10;
    }

    .wall-r { border-right: 3px solid #000000 !important; }
    .wall-b { border-bottom: 3px solid #000000 !important; }

    /* ── Buttons ── */
    .dir-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      justify-content: center;
      width: 100%;
      max-width: var(--grid-max);
    }

    .btn-dir {
      padding: 0;
      height: clamp(42px, 11vw, 52px);
      font-size: clamp(1rem, 3.2vw, 1.3rem);
      background-color: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      font-family: inherit;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-dir:hover { background-color: #e2e8f0; border-color: #94a3b8; }
    .btn-dir:active { transform: scale(0.95); }
    .btn-dir:disabled { opacity: 0.5; cursor: not-allowed; }

    .action-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: var(--grid-max);
    }

    .btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 11px 8px;
      font-size: clamp(0.75rem, 2.4vw, 0.9rem);
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
      font-family: inherit;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-end { background-color: #93c5fd; color: #1e3a8a; }
    .btn-end:hover { background-color: #60a5fa; }

    .btn-reset { background-color: #93c5fd; color: #1e3a8a; }
    .btn-reset:hover { background-color: #60a5fa; }

    .status-msg {
      font-weight: 700;
      font-size: clamp(0.75rem, 2.4vw, 0.9rem);
      min-height: 24px;
      text-align: center;
      width: 100%;
      line-height: 1.5;
    }
    .status-msg.win  { color: #16a34a; }
    .status-msg.lose { color: #dc2626; }
    .status-msg.wall { color: #d97706; }

    /* ── Mobile / Tablet: single column with correct order ── */
    @media (max-width: 640px) {
      :root { --grid-max: 320px; }

      .columns {
        flex-direction: column;
        gap: 16px;
      }

      .col {
        width: 100%;
        flex: none;
      }

      .col-left  { order: 1; }
      .col-right { order: 2; }
    }

    @media (max-width: 420px) {
      body { padding: 10px; }
      .game-container { padding: 14px; gap: 12px; border-radius: 12px; }
      .columns { gap: 12px; }
      :root { --grid-max: 280px; }
    }

    @media (max-width: 340px) {
      :root { --grid-max: 240px; }
      .btn { font-size: 0.7rem; padding: 9px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">

    <div class="columns">

      <!-- Left column: status (dark grid) + status message -->
      <div class="col col-left">
        <div class="section-label dark-label">وضعیت شما:</div>
        <div class="dark-grid-wrapper">
          <div class="dark-grid" id="darkGrid" dir="ltr"></div>
          <span class="player-emoji" id="playerEmoji">😩</span>
        </div>
        <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>
      </div>

      <!-- Right column: map + buttons -->
      <div class="col col-right">
        <div class="section-label map-label">چیزی که دوستتون می‌بینه:</div>
        <div class="grid-container" id="mapGrid" dir="ltr"></div>

        <div class="dir-buttons" dir="ltr">
          <button type="button" class="btn-dir" id="btnUp"    aria-label="بالا">⬆️</button>
          <button type="button" class="btn-dir" id="btnDown"  aria-label="پایین">⬇️</button>
          <button type="button" class="btn-dir" id="btnLeft"  aria-label="چپ">⬅️</button>
          <button type="button" class="btn-dir" id="btnRight" aria-label="راست">➡️</button>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn btn-end"   id="btnEnd">پایان</button>
          <button type="button" class="btn btn-reset" id="btnReset">از اول</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const ROWS = 6;
      const COLS = 6;
      const MOVE_DURATION = 500;

      const cellStyles = {
        "0,0": ["wall-r"],
        "0,3": ["wall-b"],
        "0,5": ["wall-b"],
        "1,0": ["wall-r"],
        "1,1": ["wall-b"],
        "1,2": ["wall-r"],
        "2,4": ["wall-r"],
        "3,0": ["wall-r", "wall-b"],
        "3,1": ["wall-r"],
        "3,4": ["wall-r"],
        "4,2": ["wall-b"],
        "4,3": ["wall-r"],
        "5,2": ["wall-r"]
      };

      const greenCells = ["0,5", "1,5", "2,3", "4,0", "4,5", "5,2", "5,4"];

      let playerPos = { r: 0, c: 0 };
      let playerEmoji = '😩';
      let isMoving = false;
      let gameEnded = false;

      const darkGridEl = document.getElementById('darkGrid');
      const playerEmojiEl = document.getElementById('playerEmoji');
      const mapGridEl = document.getElementById('mapGrid');
      const statusMsg = document.getElementById('statusMsg');
      const btnUp = document.getElementById('btnUp');
      const btnDown = document.getElementById('btnDown');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const btnEnd = document.getElementById('btnEnd');
      const btnReset = document.getElementById('btnReset');

      function buildBoards() {
        // Remove only dark cells (emoji is now OUTSIDE the grid)
        darkGridEl.querySelectorAll('.dark-cell').forEach(function (el) { el.remove(); });

        const darkFrag = document.createDocumentFragment();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'dark-cell';
            cell.id = 'dark-' + r + '-' + c;
            darkFrag.appendChild(cell);
          }
        }
        darkGridEl.appendChild(darkFrag);

        // Map grid
        mapGridEl.innerHTML = '';
        const mapFrag = document.createDocumentFragment();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'map-' + r + '-' + c;

            const key = r + ',' + c;
            if (greenCells.indexOf(key) !== -1) {
              cell.classList.add('green-cell');
            }
            if (cellStyles[key]) {
              cellStyles[key].forEach(function (styleClass) {
                cell.classList.add(styleClass);
              });
            }
            mapFrag.appendChild(cell);
          }
        }
        mapGridEl.appendChild(mapFrag);

        // Initial placement without animation
        playerEmojiEl.style.transition = 'none';
        moveDarkPlayerSmooth();
        void playerEmojiEl.offsetWidth;
        playerEmojiEl.style.transition = '';

        updateMapUI();
      }

      function updateDarkPlayerEmoji() {
        playerEmojiEl.innerText = playerEmoji;
      }

      function moveDarkPlayerSmooth() {
        const xPercent = (playerPos.c / COLS) * 100;
        const yPercent = (playerPos.r / ROWS) * 100;
        playerEmojiEl.style.top = yPercent + '%';
        playerEmojiEl.style.left = xPercent + '%';
      }

      function updateMapUI() {
        const existing = mapGridEl.querySelectorAll('.map-player');
        existing.forEach(function (el) { el.remove(); });

        const mapTarget = document.getElementById('map-' + playerPos.r + '-' + playerPos.c);
        if (mapTarget) {
          const dotEl = document.createElement('span');
          dotEl.className = 'map-player';
          mapTarget.appendChild(dotEl);
        }
      }

      function clearRevealedCells() {
        darkGridEl.querySelectorAll('.dark-cell.revealed, .dark-cell.failed').forEach(function (cell) {
          cell.classList.remove('revealed');
          cell.classList.remove('failed');
        });
      }

      function revealCurrentIfGreen() {
        clearRevealedCells();
        const currentKey = playerPos.r + ',' + playerPos.c;
        if (greenCells.indexOf(currentKey) !== -1) {
          const darkCell = document.getElementById('dark-' + playerPos.r + '-' + playerPos.c);
          if (darkCell) darkCell.classList.add('revealed');
        }
      }

      function markCurrentAsFailed() {
        clearRevealedCells();
        const currentCell = document.getElementById('dark-' + playerPos.r + '-' + playerPos.c);
        if (currentCell) currentCell.classList.add('failed');
      }

      function setControlsEnabled(enabled) {
        btnUp.disabled = !enabled;
        btnDown.disabled = !enabled;
        btnLeft.disabled = !enabled;
        btnRight.disabled = !enabled;
        btnEnd.disabled = !enabled;
        btnReset.disabled = !enabled;
      }

      function isMoveBlocked(dir) {
        const r = playerPos.r;
        const c = playerPos.c;
        const cellKey = r + ',' + c;
        const currentStyles = cellStyles[cellKey] || [];

        if (dir === 'right') {
          return currentStyles.indexOf('wall-r') !== -1 || c === COLS - 1;
        } else if (dir === 'left') {
          const leftKey = r + ',' + (c - 1);
          const leftStyles = cellStyles[leftKey] || [];
          return leftStyles.indexOf('wall-r') !== -1 || c === 0;
        } else if (dir === 'down') {
          return currentStyles.indexOf('wall-b') !== -1 || r === ROWS - 1;
        } else if (dir === 'up') {
          const topKey = (r - 1) + ',' + c;
          const topStyles = cellStyles[topKey] || [];
          return topStyles.indexOf('wall-b') !== -1 || r === 0;
        }
        return true;
      }

      function executeMove(dir) {
        if (isMoving || gameEnded) return;

        isMoving = true;
        setControlsEnabled(false);

        statusMsg.innerText = '';
        statusMsg.className = 'status-msg';

        const blocked = isMoveBlocked(dir);

        if (blocked) {
          setTimeout(function () {
            statusMsg.innerText = 'دیوار بود';
            statusMsg.className = 'status-msg wall';
            isMoving = false;
            if (!gameEnded) setControlsEnabled(true);
          }, 100);
          return;
        }

        if (dir === 'right') playerPos.c += 1;
        else if (dir === 'left') playerPos.c -= 1;
        else if (dir === 'down') playerPos.r += 1;
        else if (dir === 'up') playerPos.r -= 1;

        moveDarkPlayerSmooth();

        setTimeout(function () {
          updateMapUI();
          isMoving = false;
          if (!gameEnded) setControlsEnabled(true);
        }, MOVE_DURATION);
      }

      function endGame() {
        if (isMoving || gameEnded) return;
        gameEnded = true;

        const currentKey = playerPos.r + ',' + playerPos.c;
        if (greenCells.indexOf(currentKey) !== -1) {
          playerEmoji = '😀';
          statusMsg.innerText = 'در رو باز کردی و راه پله پشتش بود!';
          statusMsg.className = 'status-msg win';
          revealCurrentIfGreen();
        } else {
          playerEmoji = '😭';
          statusMsg.innerText = 'پشت در راه پله نبود :(';
          statusMsg.className = 'status-msg lose';
          markCurrentAsFailed();
        }
        updateDarkPlayerEmoji();

        btnUp.disabled = true;
        btnDown.disabled = true;
        btnLeft.disabled = true;
        btnRight.disabled = true;
        btnEnd.disabled = true;
        btnReset.disabled = false;
      }

      function resetGame() {
        if (isMoving) return;
        playerPos = { r: 0, c: 0 };
        playerEmoji = '😩';
        gameEnded = false;
        statusMsg.innerText = '';
        statusMsg.className = 'status-msg';

        clearRevealedCells();

        playerEmojiEl.style.transition = 'none';
        playerEmojiEl.style.top = '0%';
        playerEmojiEl.style.left = '0%';
        playerEmojiEl.innerText = playerEmoji;
        void playerEmojiEl.offsetWidth;
        playerEmojiEl.style.transition = '';

        updateMapUI();
        setControlsEnabled(true);
      }

      btnUp.addEventListener('click', function () { executeMove('up'); });
      btnDown.addEventListener('click', function () { executeMove('down'); });
      btnLeft.addEventListener('click', function () { executeMove('left'); });
      btnRight.addEventListener('click', function () { executeMove('right'); });
      btnEnd.addEventListener('click', endGame);
      btnReset.addEventListener('click', resetGame);

      document.addEventListener('keydown', function (e) {
        if (gameEnded || isMoving) return;
        if (e.key === 'ArrowUp')         { e.preventDefault(); executeMove('up'); }
        else if (e.key === 'ArrowDown')  { e.preventDefault(); executeMove('down'); }
        else if (e.key === 'ArrowLeft')  { e.preventDefault(); executeMove('left'); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); executeMove('right'); }
      });

      buildBoards();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>مینی‌گیم فرار از زندان — نسخه نقشه</title>
  <!-- اضافه کردن FontAwesome برای آیکون دکمه‌ها -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --grid-max: 300px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* جلوگیری کامل از اسکرول */
    }

    body {
      font-family: Vazirmatn, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .game-container {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100vw;
      width: 100%;
      height: 100vh;
    }

    .columns {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-direction: row-reverse;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 0;
      min-width: 0;
      align-items: center;
    }

    .section-label {
      font-size: clamp(0.7rem, 2.2vw, 0.85rem);
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      width: 100%;
    }

    /* ── Dark Grid ── */
    .dark-grid-wrapper {
      position: relative;
      border-radius: 8px;
      padding: 4px;
      background: #0f172a;
      width: 100%;
      max-width: var(--grid-max);
      aspect-ratio: 1 / 1;
    }

    .dark-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: #1e293b;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .dark-cell {
      position: relative;
      border-right: 1px solid #334155;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .dark-cell:nth-child(6n) { border-right: none; }
    .dark-cell:nth-child(n+31) { border-bottom: none; }
    .dark-cell.revealed { background-color: #16a34a; }
    .dark-cell.failed   { background-color: #dc2626; }

    .player-emoji {
      position: absolute;
      width: calc(100% / 6);
      height: calc(100% / 6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4vw, 1.5rem);
      pointer-events: none;
      z-index: 10;
      top: 0;
      left: 0;
      transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                  left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Map Grid ── */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background-color: #eaeaea;
      border-radius: 6px;
      border: 3px solid #000000;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: var(--grid-max);
      aspect-ratio: 1 / 1;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eaeaea;
      position: relative;
      border-right: 1px solid #cccccc;
      border-bottom: 1px solid #cccccc;
    }

    .cell.green-cell { background-color: #86efac !important; }
    .map-player {
      display: block;
      width: 35%;
      aspect-ratio: 1;
      border-radius: 50%;
      background-color: #0f172a;
      box-shadow: 0 0 0 2px #ffffff;
      position: absolute;
      z-index: 10;
    }

    .wall-r { border-right: 3px solid #000000 !important; }
    .wall-b { border-bottom: 3px solid #000000 !important; }

    /* ── Centered Controls (Desktop & Mobile) ── */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .status-msg {
      font-weight: 700;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      min-height: 24px;
      text-align: center;
      width: 100%;
    }
    .status-msg.win  { color: #16a34a; }
    .status-msg.lose { color: #dc2626; }
    .status-msg.wall { color: #d97706; }

    .dir-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .btn-dir {
      width: clamp(44px, 12vw, 56px);
      height: clamp(44px, 12vw, 56px);
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      background-color: #f1f5f9;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }

    .btn-dir:hover { background-color: #e2e8f0; border-color: #94a3b8; color: #0f172a; }
    .btn-dir:active { transform: scale(0.92); }
    .btn-dir:disabled { opacity: 0.5; cursor: not-allowed; }

    .action-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-end { background-color: #22c55e; color: #ffffff; }
    .btn-end:hover { background-color: #16a34a; }

    .btn-reset { background-color: #3b82f6; color: #ffffff; }
    .btn-reset:hover { background-color: #2563eb; }

    /* ── Responsive adjustments to fit EVERYTHING on one screen ── */
    @media (max-width: 640px) {
      .game-container {
        padding: 12px;
        gap: 10px;
      }
      .columns {
        gap: 10px;
        /* حتماً روی موبایل هم کنار هم بمانند تا اسکرول نیاز نشود */
        flex-direction: row-reverse; 
      }
      :root {
        --grid-max: 44vw; 
      }
      .controls-wrapper {
        gap: 8px;
      }
      .btn {
        padding: 10px 8px;
      }
    }

    @media (max-height: 650px) {
      .game-container { padding: 10px; gap: 8px; }
      .btn-dir { height: 40px; width: 40px; font-size: 1.1rem; }
      .btn { padding: 8px; font-size: 0.8rem; }
      .status-msg { min-height: 20px; font-size: 0.8rem; }
      .section-label { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="game-container">

    <!-- Grids Row -->
    <div class="columns">
      <!-- Status Map -->
      <div class="col">
        <div class="section-label text-slate-800">وضعیت شما:</div>
        <div class="dark-grid-wrapper">
          <div class="dark-grid" id="darkGrid" dir="ltr"></div>
          <span class="player-emoji" id="playerEmoji">😩</span>
        </div>
      </div>

      <!-- Friend's Map -->
      <div class="col">
        <div class="section-label text-slate-500">چیزی که دوستتون می‌بینه:</div>
        <div class="grid-container" id="mapGrid" dir="ltr"></div>
      </div>
    </div>

    <!-- Centered Controls -->
    <div class="controls-wrapper">
      <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>

      <div class="dir-buttons" dir="ltr">
        <button type="button" class="btn-dir" id="btnUp" aria-label="بالا"><i class="fa-solid fa-arrow-up"></i></button>
        <button type="button" class="btn-dir" id="btnDown" aria-label="پایین"><i class="fa-solid fa-arrow-down"></i></button>
        <button type="button" class="btn-dir" id="btnLeft" aria-label="چپ"><i class="fa-solid fa-arrow-left"></i></button>
        <button type="button" class="btn-dir" id="btnRight" aria-label="راست"><i class="fa-solid fa-arrow-right"></i></button>
        <button type="button" class="btn-dir" id="btnEnd" aria-label="خروج"><i class="fa-solid fa-door-open"></i></button>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn btn-reset" id="btnReset"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      const ROWS = 6;
      const COLS = 6;
      const MOVE_DURATION = 400;

      const cellStyles = {
        "0,0": ["wall-r"], "0,3": ["wall-b"], "0,5": ["wall-b"],
        "1,0": ["wall-r"], "1,1": ["wall-b"], "1,2": ["wall-r"],
        "2,4": ["wall-r"], "3,0": ["wall-r", "wall-b"],
        "3,1": ["wall-r"], "3,4": ["wall-r"], "4,2": ["wall-b"],
        "4,3": ["wall-r"], "5,2": ["wall-r"]
      };

      const greenCells = ["0,5", "1,5", "2,3", "4,0", "4,5", "5,2", "5,4"];

      let playerPos = { r: 0, c: 0 };
      let playerEmoji = '😩';
      let isMoving = false;
      let gameEnded = false;

      const darkGridEl = document.getElementById('darkGrid');
      const playerEmojiEl = document.getElementById('playerEmoji');
      const mapGridEl = document.getElementById('mapGrid');
      const statusMsg = document.getElementById('statusMsg');
      const btnUp = document.getElementById('btnUp');
      const btnDown = document.getElementById('btnDown');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const btnEnd = document.getElementById('btnEnd');
      const btnReset = document.getElementById('btnReset');

      function buildBoards() {
        darkGridEl.innerHTML = '';
        const darkFrag = document.createDocumentFragment();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'dark-cell';
            cell.id = 'dark-' + r + '-' + c;
            darkFrag.appendChild(cell);
          }
        }
        darkGridEl.appendChild(darkFrag);

        mapGridEl.innerHTML = '';
        const mapFrag = document.createDocumentFragment();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'map-' + r + '-' + c;

            const key = r + ',' + c;
            if (greenCells.includes(key)) cell.classList.add('green-cell');
            if (cellStyles[key]) cellStyles[key].forEach(cls => cell.classList.add(cls));
            
            mapFrag.appendChild(cell);
          }
        }
        mapGridEl.appendChild(mapFrag);

        playerEmojiEl.style.transition = 'none';
        moveDarkPlayerSmooth();
        void playerEmojiEl.offsetWidth;
        playerEmojiEl.style.transition = '';
        updateMapUI();
      }

      function updateDarkPlayerEmoji() {
        playerEmojiEl.innerText = playerEmoji;
      }

      function moveDarkPlayerSmooth() {
        const xPercent = (playerPos.c / COLS) * 100;
        const yPercent = (playerPos.r / ROWS) * 100;
        playerEmojiEl.style.top = yPercent + '%';
        playerEmojiEl.style.left = xPercent + '%';
      }

      function updateMapUI() {
        mapGridEl.querySelectorAll('.map-player').forEach(el => el.remove());
        const mapTarget = document.getElementById('map-' + playerPos.r + '-' + playerPos.c);
        if (mapTarget) {
          const dotEl = document.createElement('span');
          dotEl.className = 'map-player';
          mapTarget.appendChild(dotEl);
        }
      }

      function clearRevealedCells() {
        darkGridEl.querySelectorAll('.dark-cell.revealed, .dark-cell.failed').forEach(cell => {
          cell.classList.remove('revealed', 'failed');
        });
      }

      function revealCurrentIfGreen() {
        clearRevealedCells();
        const currentKey = playerPos.r + ',' + playerPos.c;
        if (greenCells.includes(currentKey)) {
          const darkCell = document.getElementById('dark-' + playerPos.r + '-' + playerPos.c);
          if (darkCell) darkCell.classList.add('revealed');
        }
      }

      function markCurrentAsFailed() {
        clearRevealedCells();
        const currentCell = document.getElementById('dark-' + playerPos.r + '-' + playerPos.c);
        if (currentCell) currentCell.classList.add('failed');
      }

      function setControlsEnabled(enabled) {
        btnUp.disabled = !enabled;
        btnDown.disabled = !enabled;
        btnLeft.disabled = !enabled;
        btnRight.disabled = !enabled;
        btnEnd.disabled = !enabled;
        btnReset.disabled = !enabled;
      }

      function isMoveBlocked(dir) {
        const { r, c } = playerPos;
        const currentStyles = cellStyles[`${r},${c}`] || [];

        if (dir === 'right') return currentStyles.includes('wall-r') || c === COLS - 1;
        if (dir === 'left') return (cellStyles[`${r},${c - 1}`] || []).includes('wall-r') || c === 0;
        if (dir === 'down') return currentStyles.includes('wall-b') || r === ROWS - 1;
        if (dir === 'up') return (cellStyles[`${r - 1},${c}`] || []).includes('wall-b') || r === 0;
        return true;
      }

      function executeMove(dir) {
        if (isMoving || gameEnded) return;

        isMoving = true;
        setControlsEnabled(false);
        statusMsg.innerText = '';
        statusMsg.className = 'status-msg';

        if (isMoveBlocked(dir)) {
          setTimeout(() => {
            statusMsg.innerHTML = '<i class="fa-solid fa-hand"></i> دیوار بود';
            statusMsg.className = 'status-msg wall';
            isMoving = false;
            if (!gameEnded) setControlsEnabled(true);
          }, 100);
          return;
        }

        if (dir === 'right') playerPos.c += 1;
        else if (dir === 'left') playerPos.c -= 1;
        else if (dir === 'down') playerPos.r += 1;
        else if (dir === 'up') playerPos.r -= 1;

        moveDarkPlayerSmooth();

        setTimeout(() => {
          updateMapUI();
          isMoving = false;
          if (!gameEnded) setControlsEnabled(true);
        }, MOVE_DURATION);
      }

      function endGame() {
        if (isMoving || gameEnded) return;
        gameEnded = true;

        if (greenCells.includes(`${playerPos.r},${playerPos.c}`)) {
          playerEmoji = '😀';
          statusMsg.innerHTML = '<i class="fa-solid fa-check"></i> در رو باز کردی و راه پله پشتش بود!';
          statusMsg.className = 'status-msg win';
          revealCurrentIfGreen();
        } else {
          playerEmoji = '😭';
          statusMsg.innerHTML = '<i class="fa-solid fa-xmark"></i> پشت در راه پله نبود';
          statusMsg.className = 'status-msg lose';
          markCurrentAsFailed();
        }
        
        updateDarkPlayerEmoji();
        setControlsEnabled(false);
        btnReset.disabled = false;
      }

      function resetGame() {
        if (isMoving) return;
        playerPos = { r: 0, c: 0 };
        playerEmoji = '😩';
        gameEnded = false;
        statusMsg.innerText = '';
        statusMsg.className = 'status-msg';

        clearRevealedCells();

        playerEmojiEl.style.transition = 'none';
        playerEmojiEl.style.top = '0%';
        playerEmojiEl.style.left = '0%';
        updateDarkPlayerEmoji();
        
        void playerEmojiEl.offsetWidth;
        playerEmojiEl.style.transition = '';

        updateMapUI();
        setControlsEnabled(true);
      }

      btnUp.addEventListener('click', () => executeMove('up'));
      btnDown.addEventListener('click', () => executeMove('down'));
      btnLeft.addEventListener('click', () => executeMove('left'));
      btnRight.addEventListener('click', () => executeMove('right'));
      btnEnd.addEventListener('click', endGame);
      btnReset.addEventListener('click', resetGame);

      document.addEventListener('keydown', e => {
        if (gameEnded || isMoving) return;
        if (e.key === 'ArrowUp') { e.preventDefault(); executeMove('up'); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); executeMove('down'); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); executeMove('left'); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); executeMove('right'); }
      });

      buildBoards();
    })();
  </script>
</body>
</html>

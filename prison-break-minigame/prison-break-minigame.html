<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مینی‌گیم فرار از زندان</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Vazirmatn, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* Controls Section */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }

    .speed-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2563eb;
      font-family: monospace;
    }

    input[type="text"] {
      padding: 10px 14px;
      font-size: 1.1rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      letter-spacing: 2px;
      font-family: monospace;
      font-weight: bold;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
      cursor: pointer;
    }

    /* Emoji Direction Buttons */
    .dir-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-dir {
      flex: 1;
      padding: 8px;
      font-size: 1.2rem;
      background-color: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-dir:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    .btn-dir:active {
      transform: scale(0.95);
    }

    .btn-del {
      font-size: 1rem;
      font-weight: bold;
      color: #ef4444;
      background-color: #fef2f2;
      border-color: #fca5a5;
    }

    .btn-del:hover {
      background-color: #fee2e2;
      border-color: #f87171;
    }

    /* Command Sequence Display */
    .sequence-display {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 38px;
      padding: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      align-items: center;
    }

    .char-box {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 4px;
      border: 1px solid transparent;
      color: #334155;
    }

    .char-box.active {
      background-color: #bfdbfe;
      border-color: #3b82f6;
      color: #1d4ed8;
      transform: scale(1.1);
      transition: all 0.15s ease;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-hint { background-color: #e2e8f0; color: #334155; }
    .btn-hint:hover { background-color: #cbd5e1; }

    .btn-run { background-color: #16a34a; color: #ffffff; }
    .btn-run:hover { background-color: #15803d; }

    .btn-reset { background-color: #ef4444; color: #ffffff; }
    .btn-reset:hover { background-color: #dc2626; }

    .btn:disabled, .btn-dir:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Maze Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 52px);
      grid-template-rows: repeat(6, 52px);
      background-color: #eaeaea;
      padding: 4px;
      border-radius: 6px;
      border: 4px solid #000000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: visible;
    }

    .cell {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background-color: #eaeaea;
      box-sizing: border-box;
      position: relative;
      border-right: 1px solid #cccccc;
      border-bottom: 1px solid #cccccc;
    }

    /* Green Cells (Always Visible) */
    .cell.green-cell {
      background-color: #86efac !important;
    }

    /* Player Emoji Styling */
    .player-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }

    /* Walls */
    .wall-r { border-right: 4px solid #000000 !important; }
    .wall-b { border-bottom: 4px solid #000000 !important; }

    /* Game Status Message */
    .status-msg {
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 24px;
      text-align: center;
    }
    .status-msg.win { color: #16a34a; }
    .status-msg.lose { color: #dc2626; }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>مینی‌گیم فرار از زندان 🏰</h1>

    <div class="controls">
      <div class="input-group">
        <label for="inputSeq">راهنمایی:</label>
        <input type="text" id="inputSeq" dir="ltr" placeholder="مثلا: ➡️⬇️➡️⬇️⬇️➡️➡️" value="➡️⬇️➡️⬇️⬇️➡️➡️">
      </div>

      <!-- Emoji Input Buttons Pad -->
      <div class="dir-buttons" dir="ltr">
        <button type="button" class="btn-dir" id="btnUp" onclick="addEmoji('⬆️')">⬆️</button>
        <button type="button" class="btn-dir" id="btnDown" onclick="addEmoji('⬇️')">⬇️</button>
        <button type="button" class="btn-dir" id="btnLeft" onclick="addEmoji('⬅️')">⬅️</button>
        <button type="button" class="btn-dir" id="btnRight" onclick="addEmoji('➡️')">➡️</button>
        <button type="button" class="btn-dir btn-del" id="btnDel" onclick="deleteEmoji()">⌫</button>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label for="stepSpeed">زمان هر استپ:</label>
          <span class="speed-val" id="speedLabel">0.7 ثانیه</span>
        </div>
        <input type="range" id="stepSpeed" min="200" max="1000" step="100" value="700">
      </div>

      <div class="sequence-display" id="sequenceDisplay" dir="ltr"></div>

      <div class="btn-group">
        <button class="btn btn-hint" id="btnHint">راهنمایی تصادفی</button>
        <button class="btn btn-run" id="btnRun">الفرار!</button>
        <button class="btn btn-reset" id="btnReset">از اول</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="grid-container" id="grid" dir="ltr"></div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 6;

    // Map Walls setup
    const cellStyles = {
      "0,0": ["wall-r"],
      "0,3": ["wall-b"],
      "0,5": ["wall-b"],
      "1,0": ["wall-r"],
      "1,1": ["wall-b"],
      "1,2": ["wall-r"],
      "2,4": ["wall-r"],
      "3,0": ["wall-r", "wall-b"],
      "3,1": ["wall-r"],
      "3,4": ["wall-r"],
      "4,2": ["wall-b"],
      "4,3": ["wall-r"],
      "5,2": ["wall-r"]
    };

    // Always Green Cells
    const greenCells = ["0,5", "1,5", "2,3", "4,0", "4,5", "5,2", "5,4"];

    // State Variables
    let playerPos = { r: 0, c: 0 };
    let playerEmoji = '😩';
    let isRunning = false;
    let timer = null;

    // DOM Elements
    const gridEl = document.getElementById('grid');
    const inputSeq = document.getElementById('inputSeq');
    const stepSpeed = document.getElementById('stepSpeed');
    const speedLabel = document.getElementById('speedLabel');
    const sequenceDisplay = document.getElementById('sequenceDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const btnHint = document.getElementById('btnHint');
    const btnRun = document.getElementById('btnRun');
    const btnReset = document.getElementById('btnReset');

    // Parse Emojis Array from Input String
    function parseSequence(str) {
      const matches = str.match(/(⬆️|⬇️|⬅️|➡️|⬆|⬇|⬅|➡)/g) || [];
      return matches.map(m => {
        if (m.includes('⬆')) return '⬆️';
        if (m.includes('⬇')) return '⬇️';
        if (m.includes('⬅')) return '⬅️';
        if (m.includes('➡')) return '➡️';
        return m;
      });
    }

    // Build Game Board
    function buildBoard() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;

          const key = `${r},${c}`;
          if (greenCells.includes(key)) {
            cell.classList.add('green-cell');
          }
          if (cellStyles[key]) {
            cellStyles[key].forEach(styleClass => cell.classList.add(styleClass));
          }

          gridEl.appendChild(cell);
        }
      }
      updatePlayerUI();
    }

    // Render Player Emoji
    function updatePlayerUI() {
      document.querySelectorAll('.cell').forEach(cell => {
        const emoji = cell.querySelector('.player-emoji');
        if (emoji) emoji.remove();
      });

      const targetCell = document.getElementById(`cell-${playerPos.r}-${playerPos.c}`);
      if (targetCell) {
        const emojiEl = document.createElement('span');
        emojiEl.className = 'player-emoji';
        emojiEl.innerText = playerEmoji;
        targetCell.appendChild(emojiEl);
      }
    }

    // Format Command Sequence Display
    function renderSequenceDisplay(activeIndex = -1) {
      sequenceDisplay.innerHTML = '';
      const seq = parseSequence(inputSeq.value);
      inputSeq.value = seq.join('');

      seq.forEach((dir, i) => {
        const span = document.createElement('span');
        span.className = `char-box ${i === activeIndex ? 'active' : ''}`;
        span.innerText = dir;
        sequenceDisplay.appendChild(span);
      });
    }

    // Add Emoji from Buttons
    function addEmoji(emoji) {
      if (isRunning) return;
      inputSeq.value += emoji;
      renderSequenceDisplay();
    }

    // Delete Last Emoji
    function deleteEmoji() {
      if (isRunning) return;
      const seq = parseSequence(inputSeq.value);
      seq.pop();
      inputSeq.value = seq.join('');
      renderSequenceDisplay();
    }

    // Speed Slider Label Update
    stepSpeed.addEventListener('input', () => {
      const ms = parseInt(stepSpeed.value);
      speedLabel.innerText = `${(ms / 1000).toFixed(1)} ثانیه`;
    });

    inputSeq.addEventListener('input', () => renderSequenceDisplay());

    // Generate Random Hint
    btnHint.addEventListener('click', () => {
      if (isRunning) return;
      const len = Math.floor(Math.random() * 15) + 6;
      const dirs = ['⬆️', '⬇️', '⬅️', '➡️'];
      let res = '';
      for (let i = 0; i < len; i++) {
        res += dirs[Math.floor(Math.random() * dirs.length)];
      }
      inputSeq.value = res;
      renderSequenceDisplay();
      resetGame();
    });

    // Run Movement Simulation
    btnRun.addEventListener('click', () => {
      if (isRunning) return;

      const seq = parseSequence(inputSeq.value);
      if (seq.length === 0) {
        statusMsg.innerText = 'لطفاً حداقل یک دستور حرکتی وارد کنید.';
        statusMsg.className = 'status-msg lose';
        return;
      }

      resetGame();
      isRunning = true;
      toggleControls(true);
      statusMsg.innerText = 'در حال اجرا...';
      statusMsg.className = 'status-msg';

      let stepIndex = 0;
      const intervalMs = parseInt(stepSpeed.value) || 1000;

      timer = setInterval(() => {
        if (stepIndex >= seq.length) {
          clearInterval(timer);
          isRunning = false;
          toggleControls(false);

          // Check position after execution ends
          const currentKey = `${playerPos.r},${playerPos.c}`;
          if (greenCells.includes(currentKey)) {
            playerEmoji = '😀';
            statusMsg.innerText = 'در رو باز کردی و راه پله پشتش بود!';
            statusMsg.className = 'status-msg win';
          } else {
            playerEmoji = '😭';
            statusMsg.innerText = 'پشت در راه پله نبود :(';
            statusMsg.className = 'status-msg lose';
          }

          updatePlayerUI();
          renderSequenceDisplay(-1);
          return;
        }

        renderSequenceDisplay(stepIndex);
        const command = seq[stepIndex];
        executeMove(command);

        stepIndex++;
      }, intervalMs);
    });

    // Execute Direction Step
    function executeMove(dir) {
      const r = playerPos.r;
      const c = playerPos.c;
      const cellKey = `${r},${c}`;
      const currentStyles = cellStyles[cellKey] || [];

      if (dir === '➡️') {
        if (currentStyles.includes('wall-r') || c === COLS - 1) {
          // Wall blocked
        } else {
          playerPos.c += 1;
        }
      } else if (dir === '⬅️') {
        const leftKey = `${r},${c - 1}`;
        const leftStyles = cellStyles[leftKey] || [];
        if (leftStyles.includes('wall-r') || c === 0) {
          // Wall blocked
        } else {
          playerPos.c -= 1;
        }
      } else if (dir === '⬇️') {
        if (currentStyles.includes('wall-b') || r === ROWS - 1) {
          // Wall blocked
        } else {
          playerPos.r += 1;
        }
      } else if (dir === '⬆️') {
        const topKey = `${r - 1},${c}`;
        const topStyles = cellStyles[topKey] || [];
        if (topStyles.includes('wall-b') || r === 0) {
          // Wall blocked
        } else {
          playerPos.r -= 1;
        }
      }

      updatePlayerUI();
    }

    // Reset Game State
    function resetGame() {
      if (timer) clearInterval(timer);
      isRunning = false;
      playerPos = { r: 0, c: 0 };
      playerEmoji = '😩';
      statusMsg.innerText = '';
      statusMsg.className = 'status-msg';

      toggleControls(false);
      updatePlayerUI();
      renderSequenceDisplay(-1);
    }

    btnReset.addEventListener('click', resetGame);

    function toggleControls(disabled) {
      btnRun.disabled = disabled;
      btnHint.disabled = disabled;
      inputSeq.disabled = disabled;
      stepSpeed.disabled = disabled;
      document.getElementById('btnUp').disabled = disabled;
      document.getElementById('btnDown').disabled = disabled;
      document.getElementById('btnLeft').disabled = disabled;
      document.getElementById('btnRight').disabled = disabled;
      document.getElementById('btnDel').disabled = disabled;
    }

    // Initialize
    buildBoard();
    renderSequenceDisplay();
  </script>
</body>
</html>

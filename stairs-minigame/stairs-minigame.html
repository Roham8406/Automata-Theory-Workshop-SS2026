<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>مینی‌گیم پله 🏃</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --canvas-max-w: 400px;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: Vazirmatn, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .game-container {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      width: 100%;
      max-height: 100%;
      margin: auto;
    }

    /* ── Sequence line ── */
    .sequence-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 10px;
      width: 100%;
      min-height: 52px;
      direction: ltr;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
      font-size: clamp(1.15rem, 4.5vw, 1.6rem);
      color: #000000;
      letter-spacing: 2px;
      padding: 8px 14px;
      user-select: none;
      -webkit-user-select: none;
      cursor: text;
      line-height: 1.4;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      background-color: #f8fafc;
      text-align: left;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .sequence-line:hover { border-color: #94a3b8; background-color: #f1f5f9; }
    .sequence-line.focused {
      border-color: #2563eb;
      border-style: solid;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .sequence-line.filled { justify-content: flex-start; }

    .sequence-line .char {
      display: inline-block;
      color: #000000;
      transition: color 0.15s ease, transform 0.15s ease;
      transform-origin: center;
      will-change: transform, color;
    }

    .sequence-line .char.active { transform: scale(1.4); }
    .sequence-line .char.active.R { color: #dc2626; }
    .sequence-line .char.active.L { color: #2563eb; }

    .sequence-line .placeholder {
      color: #94a3b8;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      font-weight: 500;
      font-family: Vazirmatn, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      direction: rtl;
      letter-spacing: 0;
      text-align: center;
      width: 100%;
    }

    .sequence-line .caret {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: #0f172a;
      margin-left: 2px;
      margin-right: 2px;
      vertical-align: middle;
      animation: caret-blink 1s step-end infinite;
      border-radius: 1px;
      flex: 0 0 auto;
    }

    @keyframes caret-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hidden-input {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Input Buttons (L & R) ── */
    .lr-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: var(--canvas-max-w);
      justify-content: center;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .btn-lr {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px;
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
      font-family: inherit;
      user-select: none;
      touch-action: manipulation;
    }

    .btn-lr:active { transform: scale(0.95); }
    .btn-lr:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-l { background-color: #dbeafe; color: #2563eb; border-color: #bfdbfe; }
    .btn-l:hover { background-color: #bfdbfe; }
    
    .btn-r { background-color: #fee2e2; color: #dc2626; border-color: #fecaca; }
    .btn-r:hover { background-color: #fecaca; }

    .btn-del { flex: 0 0 auto; width: 48px; background-color: #f1f5f9; color: #64748b; border-color: #e2e8f0; font-size: 1.1rem;}
    .btn-del:hover { background-color: #e2e8f0; }

    /* ── Canvas Card ── */
    .canvas-card {
      position: relative;
      background: #eaeaea;
      border: 4px solid #000000;
      border-radius: 8px;
      overflow: hidden;
      width: 100%; 
      max-width: var(--canvas-max-w);
      max-height: calc(100dvh - 290px); /* Reduced height to fit new L/R buttons */
      aspect-ratio: 400 / 380;
      margin: 0 auto; 
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    canvas {
      display: block;
      background-color: #eaeaea;
      width: 100%;
      height: 100%;
      object-fit: contain;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .status-msg {
      font-weight: 700;
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      min-height: 24px;
      text-align: center;
      line-height: 1.5;
      width: 100%;
      flex-shrink: 0;
    }
    .status-msg.info { color: #16a34a; }
    .status-msg.warn { color: #dc2626; }

    /* ── Center-aligned Actions ── */
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      width: 100%;
      max-width: var(--canvas-max-w);
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      font-size: clamp(0.75rem, 2.8vw, 0.95rem);
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
      font-family: inherit;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-hint { background-color: #e2e8f0; color: #334155; }
    .btn-hint:hover { background-color: #cbd5e1; }

    .btn-run { background-color: #16a34a; color: #ffffff; }
    .btn-run:hover { background-color: #15803d; }

    .btn-reset { background-color: #3b82f6; color: #ffffff; }
    .btn-reset:hover { background-color: #2563eb; }

    /* ── Responsive Mobile ── */
    @media (max-width: 420px) {
      .game-container { padding: 12px; gap: 10px; }
      .sequence-line { min-height: 46px; font-size: 1.3rem; padding: 6px 10px; }
      .btn { padding: 10px 6px; font-size: 0.75rem; }
      .btn-lr { padding: 8px; font-size: 0.95rem; }
      .btn-del { width: 40px; }
      .canvas-card { max-height: calc(100dvh - 250px); }
    }

    @media (max-width: 340px) {
      .btn { flex-direction: column; gap: 4px; padding: 6px; font-size: 0.65rem; }
      .sequence-line { font-size: 1.1rem; }
      .btn-lr { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="game-container">

    <input type="text"
           id="inputSeq"
           class="hidden-input"
           value="RLRRLRL"
           autocomplete="off"
           autocapitalize="characters"
           autocorrect="off"
           spellcheck="false"
           inputmode="text"
           aria-label="رشته راهنما">

    <div class="sequence-line" id="sequenceLine" dir="ltr" role="textbox" aria-label="رشته راهنما" tabindex="0"></div>

    <!-- دکمه‌های چپ و راست اضافه شده -->
    <div class="lr-buttons" dir="ltr">
      <button type="button" class="btn-lr btn-l" id="btnL">L چپ</button>
      <button type="button" class="btn-lr btn-r" id="btnR">R راست</button>
      <button type="button" class="btn-lr btn-del" id="btnDel" title="پاک کردن"><i class="fa-solid fa-delete-left"></i></button>
    </div>

    <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>

    <div class="canvas-card" id="canvasCard">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-hint" id="btnHint"><i class="fa-solid fa-dice"></i> تصادفی</button>
      <button type="button" class="btn btn-run" id="btnRun"><i class="fa-solid fa-person-running"></i> الفرار!</button>
      <button type="button" class="btn btn-reset" id="btnReset"><i class="fa-solid fa-rotate-right"></i> از اول</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STEP_DURATION = 1000;

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
      const canvasCard = document.getElementById('canvasCard');

      const inputSeq = document.getElementById('inputSeq');
      const sequenceLine = document.getElementById('sequenceLine');
      const statusMsg = document.getElementById('statusMsg');
      
      const btnL = document.getElementById('btnL');
      const btnR = document.getElementById('btnR');
      const btnDel = document.getElementById('btnDel');
      
      const btnHint = document.getElementById('btnHint');
      const btnRun = document.getElementById('btnRun');
      const btnReset = document.getElementById('btnReset');

      if (!ctx) {
        if (statusMsg) {
          statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> مرورگر شما از Canvas پشتیبانی نمی‌کند.';
          statusMsg.className = 'status-msg warn';
        }
        return;
      }

      const DESIGN_W = 400;
      const DESIGN_H = 380;

      let SCALE = 1;
      let DPR = 1;

      let posR = 0, posL = 0;
      let visualR = 0, visualL = 0;
      let liftR = 0, liftL = 0;
      let cameraStep = 0;

      let isRunning = false;
      let stepTimer = null;
      let currentAnim = null;

      const STEP_W = 60;
      const STEP_H = 50;
      const BASE_X = 60;
      const BASE_Y = 320;
      const FOOT_LIFT_MAX = 30;

      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resizeCanvas() {
        if (!canvasCard || !canvas) return;
        const rect = canvasCard.getBoundingClientRect();
        const cssW = Math.max(1, rect.width);
        const cssH = Math.max(1, rect.height);

        DPR = Math.min(window.devicePixelRatio || 1, 2);

        const newW = Math.round(cssW * DPR);
        const newH = Math.round(cssH * DPR);

        if (canvas.width !== newW || canvas.height !== newH) {
          canvas.width = newW;
          canvas.height = newH;
        }

        const scaleW = canvas.width / DESIGN_W;
        const scaleH = canvas.height / DESIGN_H;
        SCALE = Math.min(scaleW, scaleH);
      }

      function sx(v) { return v * SCALE; }
      function sy(v) { return v * SCALE; }

      function stepToCanvasCoords(stepIdx, cam) {
        const relStep = stepIdx - cam;
        const x = sx(BASE_X + relStep * STEP_W);
        const y = sy(BASE_Y - relStep * STEP_H);
        return { x, y };
      }

      function sanitizeInput() {
        const val = (inputSeq.value || '').toUpperCase().replace(/[^RL]/g, '');
        if (inputSeq.value !== val) inputSeq.value = val;
        return val;
      }

      function isInputFocused() {
        return document.activeElement === inputSeq;
      }

      function renderSequence(activeIndex) {
        if (activeIndex === undefined) activeIndex = -1;
        const val = sanitizeInput();
        sequenceLine.innerHTML = '';

        if (val.length > 0) {
          sequenceLine.classList.add('filled');
        } else {
          sequenceLine.classList.remove('filled');
        }

        const showCaret = !isRunning && isInputFocused();

        if (!val) {
          const ph = document.createElement('span');
          ph.className = 'placeholder';
          ph.textContent = 'از دکمه‌های L و R استفاده کنید';
          sequenceLine.appendChild(ph);

          if (showCaret) {
            const caret = document.createElement('span');
            caret.className = 'caret';
            sequenceLine.appendChild(caret);
          }
          return;
        }

        const frag = document.createDocumentFragment();
        for (let i = 0; i < val.length; i++) {
          const span = document.createElement('span');
          span.className = 'char ' + val[i] + (i === activeIndex ? ' active' : '');
          span.textContent = val[i];
          frag.appendChild(span);
        }

        if (showCaret) {
          const caret = document.createElement('span');
          caret.className = 'caret';
          frag.appendChild(caret);
        }

        sequenceLine.appendChild(frag);
      }

      // Input Events
      inputSeq.addEventListener('input', function () {
        if (isRunning) return;
        sanitizeInput();
        renderSequence(-1);
      });
      inputSeq.addEventListener('focus', function () {
        sequenceLine.classList.add('focused');
        renderSequence(-1);
      });
      inputSeq.addEventListener('blur', function () {
        sequenceLine.classList.remove('focused');
        renderSequence(-1);
      });
      inputSeq.addEventListener('keyup', function () {
        if (isRunning) return;
        renderSequence(-1);
      });

      // L & R Buttons Logic
      btnL.addEventListener('click', function() {
        if (isRunning) return;
        inputSeq.value += 'L';
        sanitizeInput();
        renderSequence(-1);
      });

      btnR.addEventListener('click', function() {
        if (isRunning) return;
        inputSeq.value += 'R';
        sanitizeInput();
        renderSequence(-1);
      });

      btnDel.addEventListener('click', function() {
        if (isRunning) return;
        inputSeq.value = inputSeq.value.slice(0, -1);
        sanitizeInput();
        renderSequence(-1);
      });

      document.addEventListener('keydown', function (e) {
        if (isRunning) return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        const k = e.key;
        if (k === 'r' || k === 'R') {
          e.preventDefault();
          inputSeq.value += 'R';
          sanitizeInput();
          renderSequence(-1);
        } else if (k === 'l' || k === 'L') {
          e.preventDefault();
          inputSeq.value += 'L';
          sanitizeInput();
          renderSequence(-1);
        } else if (k === 'Backspace') {
          e.preventDefault();
          inputSeq.value = inputSeq.value.slice(0, -1);
          sanitizeInput();
          renderSequence(-1);
        } else if (k === 'Delete') {
          e.preventDefault();
          inputSeq.value = '';
          renderSequence(-1);
        }
      });

      sequenceLine.addEventListener('click', function () {
        if (isRunning) return;
        try { inputSeq.focus({ preventScroll: true }); } catch (err) { inputSeq.focus(); }
      });

      sequenceLine.addEventListener('touchstart', function () {
        if (isRunning) return;
        try { inputSeq.focus({ preventScroll: true }); } catch (err) { inputSeq.focus(); }
      }, { passive: true });

      btnHint.addEventListener('click', function () {
        if (isRunning) return;
        const len = Math.floor(Math.random() * 13) + 8;
        let res = '';
        for (let i = 0; i < len; i++) {
          res += Math.random() < 0.5 ? 'R' : 'L';
        }
        inputSeq.value = res;
        renderSequence(-1);
        resetGame();
        renderSequence(-1);
      });

      btnRun.addEventListener('click', function () {
        if (isRunning) return;

        const seq = sanitizeInput();
        if (!seq) {
          statusMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> لطفاً دنباله را وارد کنید.';
          statusMsg.className = 'status-msg warn';
          return;
        }

        resetGame();
        isRunning = true;
        toggleControls(true);

        try { inputSeq.blur(); } catch (err) {}
        sequenceLine.classList.remove('focused');

        let stepIndex = 0;
        const duration = STEP_DURATION;

        function doNextStep() {
          if (stepIndex >= seq.length) {
            isRunning = false;
            toggleControls(false);

            if (posR === posL) {
              statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> دوتا پا کنار هم قرار گرفت!';
              statusMsg.className = 'status-msg info';
            } else {
              statusMsg.innerHTML = '<i class="fa-solid fa-xmark-circle"></i> دوتا پا کنار هم نیست.';
              statusMsg.className = 'status-msg warn';
            }

            renderSequence(-1);
            return;
          }

          renderSequence(stepIndex);
          const cmd = seq[stepIndex];
          executeStepCommand(cmd, duration);

          stepIndex++;
          stepTimer = setTimeout(doNextStep, duration);
        }

        doNextStep();
      });

      function executeStepCommand(cmd, duration) {
        if (cmd === 'R') {
          const nextR = posR + 1;
          if (Math.abs(nextR - posL) > 2) {
            triggerLegAnimation('R', posR, posR + 1, true, duration);
          } else {
            triggerLegAnimation('R', posR, nextR, false, duration);
            posR = nextR;
          }
        } else if (cmd === 'L') {
          const nextL = posL + 1;
          if (Math.abs(nextL - posR) > 2) {
            triggerLegAnimation('L', posL, posL + 1, true, duration);
          } else {
            triggerLegAnimation('L', posL, nextL, false, duration);
            posL = nextL;
          }
        }
      }

      function triggerLegAnimation(foot, startVal, targetVal, fail, duration) {
        currentAnim = {
          foot: foot,
          startVal: startVal,
          targetVal: targetVal,
          fail: fail,
          startTime: performance.now(),
          duration: prefersReducedMotion ? Math.min(duration, 200) : duration
        };
      }

      function renderLoop(now) {
        liftR = 0;
        liftL = 0;

        if (currentAnim) {
          const elapsed = now - currentAnim.startTime;
          const totalDuration = currentAnim.duration;
          const moveTime = totalDuration * 0.75;
          const rawProgress = Math.min(1, elapsed / moveTime);

          if (currentAnim.fail) {
            let p;
            if (rawProgress < 0.5) {
              p = (rawProgress / 0.5) * 0.5;
            } else {
              p = 0.5 * (1 - (rawProgress - 0.5) / 0.5);
            }

            const curStep = currentAnim.startVal + p * (currentAnim.targetVal - currentAnim.startVal);
            const currentLift = Math.sin(rawProgress * Math.PI) * (FOOT_LIFT_MAX * 0.7);

            if (currentAnim.foot === 'R') {
              visualR = curStep;
              liftR = currentLift;
            } else {
              visualL = curStep;
              liftL = currentLift;
            }
          } else {
            const p = 0.5 - Math.cos(rawProgress * Math.PI) / 2;
            const curStep = currentAnim.startVal + p * (currentAnim.targetVal - currentAnim.startVal);
            const currentLift = Math.sin(rawProgress * Math.PI) * FOOT_LIFT_MAX;

            if (currentAnim.foot === 'R') {
              visualR = curStep;
              liftR = currentLift;
            } else {
              visualL = curStep;
              liftL = currentLift;
            }
          }

          if (elapsed >= totalDuration) {
            if (!currentAnim.fail) {
              if (currentAnim.foot === 'R') visualR = currentAnim.targetVal;
              else visualL = currentAnim.targetVal;
            } else {
              if (currentAnim.foot === 'R') visualR = currentAnim.startVal;
              else visualL = currentAnim.startVal;
            }
            currentAnim = null;
          }
        } else {
          visualR = posR;
          visualL = posL;
        }

        const targetCam = Math.min(visualR, visualL);
        cameraStep += (targetCam - cameraStep) * 0.08;

        drawCanvas();
        requestAnimationFrame(renderLoop);
      }

      function drawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3.5 * SCALE;
        ctx.lineCap = 'square';
        ctx.beginPath();

        const startStep = Math.floor(cameraStep) - 2;
        const endStep = Math.floor(cameraStep) + 8;

        for (let s = startStep; s <= endStep; s++) {
          const p1 = stepToCanvasCoords(s, cameraStep);
          const p2 = { x: p1.x + sx(STEP_W), y: p1.y };
          const p3 = { x: p2.x, y: p2.y - sy(STEP_H) };

          if (s === startStep) ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
        }
        ctx.stroke();

        const footOffX = sx(22);
        const footR_Base = stepToCanvasCoords(visualR, cameraStep);
        const footL_Base = stepToCanvasCoords(visualL, cameraStep);

        const footR_x = footR_Base.x + footOffX;
        const footR_y = footR_Base.y - sy(liftR);

        const footL_x = footL_Base.x + footOffX - sx(6);
        const footL_y = footL_Base.y - sy(liftL);

        const groundY = Math.min(footR_Base.y, footL_Base.y);
        const hipX = (footR_x + footL_x) / 2;
        const hipY = groundY - sy(65);

        const headRadius = sx(11);
        const headX = hipX;
        const headY = hipY - sy(45);

        ctx.lineWidth = 2.8 * SCALE;
        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(headX, headY + headRadius);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        const kneeR_x = (hipX + footR_x) / 2 + sx(liftR > 0 ? 10 : 6);
        const kneeR_y = (hipY + footR_y) / 2 - sy(liftR > 0 ? 12 : 4);
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(kneeR_x, kneeR_y);
        ctx.lineTo(footR_x, footR_y);
        ctx.stroke();

        const kneeL_x = (hipX + footL_x) / 2 - sx(liftL > 0 ? 2 : 6);
        const kneeL_y = (hipY + footL_y) / 2 - sy(liftL > 0 ? 12 : 4);
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(kneeL_x, kneeL_y);
        ctx.lineTo(footL_x, footL_y);
        ctx.stroke();

        const dist = Math.abs(visualR - visualL);

        ctx.lineWidth = 2 * SCALE;
        ctx.strokeStyle = '#475569';
        ctx.beginPath();
        ctx.arc(footR_x, footR_y - sy(2), sx(4), 0, Math.PI * 2);
        ctx.arc(footL_x, footL_y - sy(2), sx(4), 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2 * SCALE;
        ctx.beginPath();
        ctx.moveTo(footL_x, footL_y - sy(2));

        if (dist < 0.2) {
          ctx.quadraticCurveTo((footL_x + footR_x) / 2, Math.max(footL_y, footR_y) + sy(16), footR_x, footR_y - sy(2));
        } else if (dist <= 1.8) {
          ctx.quadraticCurveTo((footL_x + footR_x) / 2, Math.max(footL_y, footR_y) + sy(8), footR_x, footR_y - sy(2));
        } else {
          ctx.lineTo(footR_x, footR_y - sy(2));
        }
        ctx.stroke();
      }

      function resetGame() {
        if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
        isRunning = false;
        posR = 0; posL = 0;
        visualR = 0; visualL = 0;
        liftR = 0; liftL = 0;
        cameraStep = 0;
        currentAnim = null;
        statusMsg.innerText = '';
        statusMsg.className = 'status-msg';
        toggleControls(false);
        renderSequence(-1);
      }

      btnReset.addEventListener('click', resetGame);

      function toggleControls(disabled) {
        btnRun.disabled = disabled;
        btnHint.disabled = disabled;
        btnL.disabled = disabled;
        btnR.disabled = disabled;
        btnDel.disabled = disabled;
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden && isRunning && stepTimer) {
          clearTimeout(stepTimer);
          stepTimer = null;
        }
      });

      sanitizeInput();
      renderSequence(-1);

      let resizeRaf = null;
      function scheduleResize() {
        if (resizeRaf) return;
        resizeRaf = requestAnimationFrame(function () {
          resizeRaf = null;
          resizeCanvas();
        });
      }

      window.addEventListener('resize', scheduleResize, { passive: true });
      window.addEventListener('orientationchange', scheduleResize, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleResize, { passive: true });
        window.visualViewport.addEventListener('scroll', scheduleResize, { passive: true });
      }

      if (typeof ResizeObserver !== 'undefined' && canvasCard) {
        const ro = new ResizeObserver(scheduleResize);
        ro.observe(canvasCard);
      }

      resizeCanvas();
      requestAnimationFrame(function () {
        resizeCanvas();
        requestAnimationFrame(renderLoop);
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مینی‌گیم راستی‌آزمایی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f3f4f6;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* انیمیشن باز شدن قفل */
        .unlock-anim {
            animation: unlockPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes unlockPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-slate-800">

    <div class="rounded-2xl p-8 w-full max-w-sm flex flex-col items-center transform transition-all">
        
        <!-- آیدی‌های lockContainer و lockIcon اضافه شد -->
        <div id="lockContainer" class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mb-4 shadow-sm border border-blue-100 transition-colors duration-300">
            <i id="lockIcon" class="fa-solid fa-lock"></i>
        </div>
        
        <h1 class="text-2xl font-bold mb-2 text-slate-800">قفلِ استیت</h1>
        <p class="text-slate-500 text-sm text-center mb-8">برای رفتن به مرحله بعد، رمز صحیح را وارد کنید.</p>
        
        <div class="flex w-full gap-2" id="inputContainer">
            <input type="text" id="codeInput" 
                   class="flex-1 border-2 border-slate-200 rounded-xl px-4 py-3 text-center font-mono text-xl md:text-2xl text-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all" 
                   placeholder="____" 
                   dir="ltr" 
                   autocomplete="off"
                   maxlength="10"
                   style="width: 100%;">
                   
            <button id="verifyBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 shrink-0">
                بررسی
            </button>
        </div>
        
        <div id="statusMsg" class="mt-6 h-6 text-center font-bold text-sm md:text-base transition-all duration-300 opacity-0"></div>

    </div>

    <script>
        const codeInput = document.getElementById('codeInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const statusMsg = document.getElementById('statusMsg');
        const inputContainer = document.getElementById('inputContainer');
        const lockIcon = document.getElementById('lockIcon');
        const lockContainer = document.getElementById('lockContainer');

        function checkCode() {
            const val = codeInput.value.trim();
            
            statusMsg.classList.remove('opacity-0');

            if (val === "1100") {
                statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> پاسخ درسته! برو استیت بعد.';
                statusMsg.className = "mt-6 h-6 text-center font-bold text-sm md:text-base transition-all duration-300 text-green-600";
                
                codeInput.classList.replace('border-slate-200', 'border-green-500');
                codeInput.classList.replace('focus:border-blue-500', 'focus:border-green-500');
                codeInput.classList.replace('focus:ring-blue-500/20', 'focus:ring-green-500/20');
                
                // تغییر آیکون، اضافه شدن انیمیشن و تغییر رنگ حباب قفل
                lockIcon.className = "fa-solid fa-lock-open unlock-anim";
                lockContainer.classList.replace('bg-blue-50', 'bg-green-50');
                lockContainer.classList.replace('text-blue-600', 'text-green-600');
                lockContainer.classList.replace('border-blue-100', 'border-green-100');

                codeInput.disabled = true;
                verifyBtn.disabled = true;
                verifyBtn.classList.replace('bg-blue-600', 'bg-green-600');
                verifyBtn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                verifyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
                
            } else {
                statusMsg.innerHTML = '<i class="fa-solid fa-xmark-circle"></i> اشتباه بود! دوباره تلاش کن.';
                statusMsg.className = "mt-6 h-6 text-center font-bold text-sm md:text-base transition-all duration-300 text-red-500";
                
                inputContainer.classList.remove('shake');
                void inputContainer.offsetWidth;
                inputContainer.classList.add('shake');
                
                codeInput.value = "";
                codeInput.focus();
            }
        }

        verifyBtn.addEventListener('click', checkCode);

        codeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkCode();
            }
        });

        window.onload = () => {
            codeInput.focus();
        };
    </script>
</body>
</html>
